<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PickSim – Lager-Simulator</title>
  <meta name="description" content="3D-Simulation der Kommissionierung in vier Lagertypen – im Browser und auf der Meta Quest 3.">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1117'/%3E%3Cpath d='M14 46V22l18-10 18 10v24' fill='none' stroke='%23f5a524' stroke-width='5' stroke-linejoin='round'/%3E%3Crect x='24' y='32' width='16' height='14' fill='%23f5a524'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <div id="viewport"></div>

    <!-- In-Game-HUD (Desktop) -->
    <div id="hud" hidden>
      <div class="hud-mission">
        <div class="hud-level" id="hud-level"></div>
        <div class="hud-objective" id="hud-objective"></div>
      </div>
      <div class="hud-stats" id="hud-stats"></div>
      <div id="crosshair"><span></span></div>
      <div id="tooltip" hidden></div>
      <div id="device-dock" hidden>
        <div class="device-frame"><canvas id="device-canvas"></canvas></div>
        <div class="device-caption" id="device-caption"></div>
      </div>
      <div id="toasts"></div>
      <div id="hint-bar"></div>
      <div id="hand-badge" hidden></div>
    </div>

    <!-- Menüs, Briefing, Auswertung -->
    <div id="overlay" hidden></div>

    <div id="loading" hidden>
      <div class="loading-box">
        <div class="loading-title" id="loading-title">Lager wird aufgebaut …</div>
        <div class="loading-bar"><span id="loading-bar"></span></div>
        <div class="loading-detail" id="loading-detail"></div>
      </div>
    </div>

    <div id="click-to-play" hidden>
      <div>Klicken zum Weiterspielen</div>
      <small>ESC gibt die Maus frei</small>
    </div>
  </div>

  <noscript>Diese Simulation benötigt JavaScript und einen aktuellen Browser (Chrome, Edge, Firefox oder Meta Quest Browser).</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
